<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NYC NOPV Property Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f14;--panel:#13161e;--border:#1e2330;--accent:#e8ff47;--accent2:#47c5ff;--text:#e2e8f0;--muted:#64748b;--red:#ff4757;--green:#47ff8c;--w:300px}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;height:100vh;display:flex;overflow:hidden}
#sidebar{width:var(--w);min-width:var(--w);background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:100;overflow:hidden}
#hdr{padding:18px 18px 14px;border-bottom:1px solid var(--border)}
.tag{font-size:9px;letter-spacing:.2em;color:var(--accent);text-transform:uppercase;margin-bottom:5px}
h1{font-family:'Syne',sans-serif;font-size:17px;font-weight:800;line-height:1.2;color:#fff}
h1 span{color:var(--accent)}
.sub{font-size:10px;color:var(--muted);margin-top:5px;line-height:1.5}
#stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--border);border-bottom:1px solid var(--border)}
.sc{background:var(--panel);padding:9px 13px}
.sk{font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sv{font-size:17px;font-family:'Syne',sans-serif;font-weight:700;color:var(--accent);margin-top:1px}
#filters{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:14px}
#filters::-webkit-scrollbar{width:3px}
#filters::-webkit-scrollbar-thumb{background:var(--border)}
.fg{display:flex;flex-direction:column;gap:7px}
.fl{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent2);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{padding:4px 9px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:'DM Mono',monospace;font-size:11px;cursor:pointer;border-radius:3px;transition:all .15s}
.chip.on{background:var(--accent);border-color:var(--accent);color:#0d0f14;font-weight:500}
.bchips{display:flex;flex-direction:column;gap:3px}
.bchip{display:flex;align-items:center;gap:7px;padding:5px 9px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:'DM Mono',monospace;font-size:11px;cursor:pointer;border-radius:3px;transition:all .15s;text-align:left}
.bchip.on{border-color:var(--accent2);color:var(--accent2);background:rgba(71,197,255,.05)}
.bd{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.srow{display:flex;align-items:center;gap:7px}
.sval{font-size:10px;color:var(--text);min-width:72px;text-align:right;white-space:nowrap}
input[type=range]{flex:1;-webkit-appearance:none;height:2px;background:var(--border);border-radius:1px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid var(--bg)}
.slbls{display:flex;justify-content:space-between;font-size:9px;color:var(--muted);margin-top:3px}
.trow{display:flex;align-items:center;gap:9px}
.tog{width:34px;height:18px;background:var(--border);border-radius:9px;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0;border:none}
.tog.on{background:var(--accent)}
.tog::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;background:#fff;border-radius:50%;transition:transform .2s}
.tog.on::after{transform:translateX(16px)}
.tlbl{font-size:10px;color:var(--text)}



.msw{width:28px;height:7px;border-radius:2px;flex-shrink:0}


#legend{padding:11px 14px;border-top:1px solid var(--border)}
.lt{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.lb{height:7px;border-radius:2px;margin-bottom:4px}
.ltx{display:flex;justify-content:space-between;font-size:9px;color:var(--muted)}
#reset{margin:0 14px 14px;padding:8px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;border-radius:3px;transition:all .15s}
#reset:hover{border-color:var(--red);color:var(--red)}
#map{flex:1}
.leaflet-container{background:#0a0c10}
/* Dark map tiles */
.leaflet-tile{filter:brightness(.9) invert(1) contrast(1.1) hue-rotate(180deg) sepia(.1)}
/* Popup styling */
.leaflet-popup-content-wrapper{background:#13161e!important;border:1px solid #1e2330!important;border-radius:4px!important;box-shadow:0 8px 32px rgba(0,0,0,.6)!important;color:#e2e8f0!important;font-family:'DM Mono',monospace!important}
.leaflet-popup-tip{background:#13161e!important}
.p-addr{font-family:'Syne',sans-serif;font-weight:700;font-size:13px;color:#fff;margin-bottom:4px}
.p-sub{font-size:8px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.p-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px}
.p-k{font-size:8px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.p-v{font-size:12px;color:#e2e8f0;margin-top:1px}
.p-v.hi{color:var(--red)}.p-v.lo{color:var(--green)}
#loading{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;z-index:9999;transition:opacity .5s}
#loading.out{opacity:0;pointer-events:none}
.lt2{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:#fff}
.ls{font-size:10px;color:var(--muted)}
.lbw{width:200px;height:2px;background:var(--border);border-radius:1px;overflow:hidden;margin-top:4px}
.lba{height:100%;background:var(--accent);border-radius:1px;animation:lp 1.4s ease-in-out infinite}
@keyframes lp{0%{width:0%}60%{width:75%}100%{width:100%}}
</style>
</head>
<body>

<div id="loading">
  <div style="font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)">NYC NOPV &middot; 2026</div>
  <div class="lt2">Loading Map</div>
  <div class="ls" id="load-status">Parsing properties&hellip;</div>
  <div class="lbw"><div class="lba"></div></div>
</div>

<div id="sidebar">
  <div id="hdr">
    <div class="tag">NYC NOPV &middot; 2026 Tax Year</div>
    <h1>Rent-Stabilized<br><span>Property Map</span></h1>
    <div class="sub">18,152 properties &middot; Click any dot for details</div>
  </div>
  <div id="stats">
    <div class="sc"><div class="sk">Visible</div><div class="sv" id="cnt">&mdash;</div></div>
    <div class="sc"><div class="sk">Visible Units</div><div class="sv" id="visunits">&mdash;</div></div>
    <div class="sc"><div class="sk">Avg CTI</div><div class="sv" id="ocravg">&mdash;</div></div>
  </div>
  <div id="filters">
  </div>
  <div id="legend">
    <div class="lt" id="ltitle">Cost-to-Income Ratio</div>
    <div class="lb" id="lbar" style="background:linear-gradient(90deg,#ff4757,#ffd147,#47ff8c)"></div>
    <div class="ltx" id="ltix"><span>0%</span><span>75%</span><span>150%+</span></div>
  </div>

</div>

<div id="map"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const MAX_TV = 718000000;

// ── COLORS ────────────────────────────────────────────────────────────────
const OCR_STOPS=[[71,255,140],[255,209,71],[255,71,87]];

function lerp3(t,stops){
  t=Math.max(0,Math.min(1,t));
  const n=stops.length-1,i=Math.min(Math.floor(t*n),n-1),f=t*n-i,a=stops[i],b=stops[i+1];
  const r=a[0]+(b[0]-a[0])*f|0,g=a[1]+(b[1]-a[1])*f|0,bl=a[2]+(b[2]-a[2])*f|0;
  return `rgb(${r},${g},${bl})`;
}

function getColor(i){ return lerp3(D.ocr[i]/1.5, OCR_STOPS); }

// ── STATE ─────────────────────────────────────────────────────────────────
let D=null;

function fmt$(v){if(v>=1e6)return'$'+(v/1e6).toFixed(1)+'M';if(v>=1e3)return'$'+(v/1e3).toFixed(0)+'K';return'$'+v}

// ── LEAFLET MAP ───────────────────────────────────────────────────────────
const renderer = L.canvas({ padding: 0.5 });
const map = L.map('map', { center:[40.705,-73.97], zoom:11, zoomControl:true });

L.tileLayer('https://cartodb-basemaps-{s}.global.ssl.fastly.net/dark_all/{z}/{x}/{y}.png',{
  attribution:'&copy; OpenStreetMap contributors &copy; CARTO',
  subdomains:'abcd', maxZoom:19
}).addTo(map);

// ── MARKER LAYER ──────────────────────────────────────────────────────────
let layerGroup = L.layerGroup().addTo(map);

function popupHTML(i) {
  const ocr = D.ocr[i];
  const ocrPct = (ocr*100).toFixed(1)+'%';
  const ocrCls = ocr>0.6?'hi':ocr<0.35?'lo':'';
  return `<div class="p-addr">${D.addr[i]}</div>
<div class="p-sub">${D.bor[i]} &middot; ${D.bc[i]}</div>
<div class="p-grid">
  <div><div class="p-k">Taxable Value</div><div class="p-v">${fmt$(D.tv[i])}</div></div>
  <div><div class="p-k">Market Value</div><div class="p-v">${fmt$(D.mv[i])}</div></div>
  <div><div class="p-k">Gross Income</div><div class="p-v">${D.egi[i]?fmt$(D.egi[i]):'&mdash;'}</div></div>
  <div><div class="p-k">Net Op. Income</div><div class="p-v">${D.noi[i]?fmt$(D.noi[i]):'&mdash;'}</div></div>
  <div><div class="p-k">Taxes</div><div class="p-v">${D.tax[i]?fmt$(D.tax[i]):'&mdash;'}</div></div>
  <div><div class="p-k">Tax Rate</div><div class="p-v">${D.tr[i]?D.tr[i].toFixed(3)+'%':'&mdash;'}</div></div>
  <div><div class="p-k">Adj. Expenses</div><div class="p-v">${D.ae[i]?fmt$(D.ae[i]):'&mdash;'}</div></div>
  <div><div class="p-k">Cost-to-Income</div><div class="p-v ${ocrCls}">${ocrPct}</div></div>
  <div><div class="p-k">Res. Units</div><div class="p-v">${D.ru[i]||'&mdash;'}</div></div>
  <div><div class="p-k">Gross Sq Ft</div><div class="p-v">${D.gsf[i]?D.gsf[i].toLocaleString():'&mdash;'}</div></div>
  <div><div class="p-k">Exemption</div><div class="p-v">${D.ex[i]===1?'&#10003; Exempt':'Not Exempt'}</div></div>
</div>`;
}

// ── RENDER ────────────────────────────────────────────────────────────────
let renderTimer=null;
function scheduleRender(){ clearTimeout(renderTimer); renderTimer=setTimeout(doRender,30); }

function doRender(){
  layerGroup.clearLayers();
  if(!D) return;
  let count=0, ocrSum=0, visUnits=0;
  for(let i=0;i<D.n;i++){
    count++;
    ocrSum+=D.ocr[i];
    visUnits+=(D.ru[i]||0);
    const color=getColor(i);
    const m=L.circleMarker([D.lat[i],D.lon[i]],{
      radius:4, color:color, fillColor:color,
      fillOpacity:0.85, weight:0, renderer
    });
    m.bindPopup(popupHTML(i),{maxWidth:280});
    layerGroup.addLayer(m);
  }
  document.getElementById('cnt').textContent=count.toLocaleString();
  document.getElementById('visunits').textContent=visUnits.toLocaleString();
  document.getElementById('ocravg').textContent=count?(ocrSum/count*100).toFixed(1)+'%':'&mdash;';
}

// ── INIT ──────────────────────────────────────────────────────────────────
window.addEventListener('load', async ()=>{
  document.getElementById('load-status').textContent='Fetching property data…';
  try {
    const resp = await fetch('nopv_data.json');
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    document.getElementById('load-status').textContent='Parsing data…';
    D = await resp.json();
    document.getElementById('load-status').textContent='Rendering map…';
    setTimeout(()=>{
      doRender();
      const el=document.getElementById('loading');
      el.classList.add('out');
      setTimeout(()=>el.remove(),600);
    },50);
  } catch(err){
    document.getElementById('load-status').textContent='Error: '+err.message;
    console.error(err);
  }
});
</script>
</body>
</html>
