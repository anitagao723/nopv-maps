<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NYC NOPV — Assembly Districts</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f14;--panel:#13161e;--border:#1e2330;--accent:#e8ff47;--accent2:#47c5ff;--text:#e2e8f0;--muted:#64748b;--red:#ff4757;--green:#47ff8c;--w:300px}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:"DM Mono",monospace;height:100vh;display:flex;overflow:hidden}
#sidebar{width:var(--w);min-width:var(--w);background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:var(--border) transparent}#sidebar::-webkit-scrollbar{width:4px}#sidebar::-webkit-scrollbar-track{background:transparent}#sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
#hdr{padding:16px 16px 12px;border-bottom:1px solid var(--border);flex-shrink:0}
.tag{font-size:9px;letter-spacing:.2em;color:var(--accent);text-transform:uppercase;margin-bottom:4px}
h1{font-family:"Syne",sans-serif;font-size:16px;font-weight:800;line-height:1.2;color:#fff}
h1 span{color:var(--accent)}
.sub{font-size:10px;color:var(--muted);margin-top:4px;line-height:1.5}
#dist-panel{padding:12px 14px;border-bottom:1px solid var(--border);flex-shrink:0}
#filters{flex-shrink:0}
#rankings{border-top:1px solid var(--border);flex-shrink:0}
.dp-lbl{font-size:8px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.dp-num{font-family:"Syne",sans-serif;font-size:22px;font-weight:800;color:var(--accent);line-height:1}
.dp-name{font-size:11px;color:#fff;margin-top:2px}
.dp-party{font-size:10px;margin-top:1px;letter-spacing:.1em}
.party-D{color:#47c5ff}.party-R{color:#ff4757}.party-I{color:#47ffbd}
.dp-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:8px}
.dp-cell{background:rgba(255,255,255,.04);border-radius:3px;padding:6px 8px}
.dp-k{font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.dp-v{font-size:11px;font-weight:700;color:var(--text);margin-top:1px}
.dp-ph{color:var(--muted);font-size:10px;line-height:1.6}
#metric-controls{padding:12px 14px;border-bottom:1px solid var(--border);flex-shrink:0}
.fl{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent2);font-weight:500;margin-bottom:6px}
.mbts{display:flex;flex-direction:column;gap:3px}
.mbt{display:flex;align-items:center;gap:7px;padding:5px 9px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:"DM Mono",monospace;font-size:10px;cursor:pointer;border-radius:3px;transition:all .15s;text-align:left}
.mbt.on{border-color:var(--accent);color:var(--text)}
.bchip{flex:1;padding:6px 9px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:"DM Mono",monospace;font-size:10px;cursor:pointer;border-radius:3px;transition:all .15s;text-align:center}
.bchip.on{border-color:var(--accent);color:var(--text)}
.msw{width:26px;height:6px;border-radius:2px;flex-shrink:0}
#dist-list{}

.dl-item{display:flex;align-items:center;padding:7px 14px;border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer;transition:background .1s;gap:7px}
.dl-item:hover{background:rgba(255,255,255,.04)}
.dl-item.active{background:rgba(232,255,71,.07);border-left:2px solid var(--accent)}
.dl-num{font-family:"Syne",sans-serif;font-weight:800;font-size:12px;color:var(--accent);min-width:26px}
.dl-name{font-size:10px;color:var(--text);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl-val{font-size:10px;color:var(--muted);min-width:42px;text-align:right}
.dl-header{display:flex;align-items:center;padding:6px 14px;gap:7px;border-bottom:1px solid var(--border)}
.dl-header .dl-num,.dl-header .dl-name,.dl-header .dl-val{font-family:"DM Mono",monospace;font-size:8px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
#legend{padding:9px 14px;border-top:1px solid var(--border);flex-shrink:0}
.lt{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.lb{height:6px;border-radius:2px;margin-bottom:3px}
.ltx{display:flex;justify-content:space-between;font-size:9px;color:var(--muted)}
.disc-legend{display:none;flex-direction:column;gap:6px;max-height:240px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.disc-legend.show{display:flex}
.disc-row{display:flex;align-items:center;gap:9px;padding:8px 10px;border:1px solid var(--accent2);border-radius:4px;background:rgba(13,15,20,.6);cursor:pointer;transition:all .15s}
.disc-row:hover{background:rgba(71,197,255,.12)}
.disc-row.active{border-color:var(--accent);background:rgba(232,255,71,.1)}
.disc-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.disc-label{font-size:11px;color:var(--accent2);letter-spacing:.03em;font-weight:500}
#map{flex:1}
.leaflet-container{background:#0a0c10}
.leaflet-tile{filter:brightness(.9) invert(1) contrast(1.1) hue-rotate(180deg) sepia(.1)}
.leaflet-popup-content-wrapper{background:#13161e!important;border:1px solid #1e2330!important;border-radius:4px!important;box-shadow:0 8px 32px rgba(0,0,0,.6)!important;color:#e2e8f0!important;font-family:"DM Mono",monospace!important;min-width:220px}
.leaflet-popup-tip{background:#13161e!important}
.pu-num{font-family:"Syne",sans-serif;font-weight:800;font-size:14px;color:var(--accent)}
.pu-name{font-size:11px;color:#fff;margin-top:2px}
.pu-party{font-size:10px;margin-top:2px;letter-spacing:.1em}
.pu-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin-top:8px}
.pu-k{font-size:8px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pu-v{font-size:11px;color:#e2e8f0;margin-top:1px}
#loading{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;z-index:9999;transition:opacity .5s}
#loading.out{opacity:0;pointer-events:none}
.lt2{font-family:"Syne",sans-serif;font-size:22px;font-weight:800;color:#fff}
.ls{font-size:10px;color:var(--muted)}
.lbw{width:200px;height:2px;background:var(--border);border-radius:1px;overflow:hidden;margin-top:4px}
.lba{height:100%;background:var(--accent);border-radius:1px;animation:lp 1.4s ease-in-out infinite}
@keyframes lp{0%{width:0%}60%{width:75%}100%{width:100%}}
</style>
</head>
<body>
<div id="loading">
  <div style="font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)">NYC NOPV &middot; 2026</div>
  <div class="lt2">Loading</div>
  <div class="ls" id="load-status">Fetching data&hellip;</div>
  <div class="lbw"><div class="lba"></div></div>
</div>
<div id="sidebar">
  <div id="hdr">
    <div class="tag">NYC NOPV &middot; 2026</div>
    <h1>Assembly Districts<br><span>District Map</span></h1>
    <div class="sub">Hover or click a district<br>to explore aggregated property data</div>
  </div>
  <div id="filters">
  <div id="dist-panel">
    <div class="dp-lbl">Selected District</div>
    <div class="dp-ph" id="dp-ph">Hover or click a district on the map</div>
    <div id="dp-detail" style="display:none">
      <div style="display:flex;align-items:baseline;gap:8px">
        <div class="dp-num" id="dp-num"></div>
        <div><div class="dp-name" id="dp-name"></div><div class="dp-party" id="dp-party"></div></div>
      </div>
      <div class="dp-grid" id="dp-grid"></div>
    </div>
  </div>
  <div id="metric-controls">
    <div class="fl">District Colors</div>
    <div class="mbts">
        <button class="mbt on" data-metric="ocr"><div class="msw" style="background:linear-gradient(90deg,#ff4757,#ffd147,#47ff8c)"></div>Distress Rate</button>
        <button class="mbt" data-metric="ru"><div class="msw" style="background:linear-gradient(90deg,#c847ff,#e8ff47)"></div>Residential Units</button>
    </div>
  </div>
  <div style="padding:8px 14px;border-bottom:1px solid var(--border);flex-shrink:0">
    <div class="fl">Display Scale</div>
    <div style="display:flex;gap:6px">
      <button class="bchip on" id="modeContinuous" onclick="setColorMode('continuous')">Continuous</button>
      <button class="bchip"    id="modeDiscrete" onclick="setColorMode('discrete')">Discrete</button>
    </div>
  </div>
  <div id="legend">
    <div class="lt" id="ltitle"></div>
    <div class="lb" id="lbar"></div>
    <div class="ltx" id="ltx"><span>Less</span><span>More</span></div>
    <div class="disc-legend" id="discLegend"></div>
  </div>
  <div id="rankings">
    <div class="fl" style="padding:8px 14px 0;flex-shrink:0">District Rankings</div>
    <div class="dl-header" id="dl-header" style="flex-shrink:0">
      <div class="dl-num">Dist.</div>
      <div class="dl-name">Representative</div>
      <div class="dl-val" id="dlh-val"></div>
    </div>
    <div id="dist-list"></div>
  </div>
  </div><!-- /#filters -->
</div>
<div id="map"></div>

  const vals=Object.values(AGG).map(d=>d[k]||0);
  if(!vals.length) return {mn:0,mx:1,edges:[1]};
  const mn=Math.min(...vals), mx=Math.max(...vals);
  const span=(mx-mn)||1;
  const edges=[];
  for(let i=1;i<=10;i++) edges.push(mn+span*i/10);
  return {mn,mx,edges};
}
function bucketIndex(edges,v){
  let idx=edges.findIndex(e=>v<=e);
  if(idx===-1) idx=edges.length;
  return idx;
}
function toggleBucketFilter(idx){
  if(activeFilterBuckets.has(idx)) activeFilterBuckets.delete(idx);
  else activeFilterBuckets.add(idx);
  renderDiscreteLegend();
  refreshLayer();
  buildList();
}
function renderDiscreteLegend(){
  const cfg=METRIC_CFG[curMetric];
  const el=document.getElementById('discLegend');
  const rows=[];
  const {edges}=dataEdges(curMetric);
  edges.forEach((e,i)=>{
    rows.push({color:lerp3(i/edges.length,cfg.stops),label:`≤ ${cfg.fmt(e)}`});
  });
  rows.push({color:lerp3(1,cfg.stops),label:`${cfg.fmt(edges[edges.length-1])}+`});
  el.innerHTML=rows.map((r,i)=>`<div class="disc-row${activeFilterBuckets.has(i)?' active':''}" onclick="toggleBucketFilter(${i})"><div class="disc-dot" style="background:${r.color}"></div><div class="disc-label">${r.label}</div></div>`).join('');
}
function setColorMode(mode){
  colorMode=mode;
  activeFilterBuckets.clear();
  document.getElementById('modeContinuous').classList.toggle('on',mode==='continuous');
  document.getElementById('modeDiscrete').classList.toggle('on',mode==='discrete');
  document.getElementById('lbar').style.display=mode==='continuous'?'block':'none';
  document.getElementById('ltx').style.display=mode==='continuous'?'flex':'none';
  document.getElementById('discLegend').classList.toggle('show',mode==='discrete');
  if(mode==='discrete') renderDiscreteLegend();
  refreshLayer();
  buildList();
}
let AGG    = {};   // district_key -> stat object  (pre-computed in Python)
let selDist = null;
let distLayer = null;

const map = L.map('map',{center:[40.72,-73.97],zoom:11,zoomControl:true});
L.tileLayer('https://cartodb-basemaps-{s}.global.ssl.fastly.net/dark_all/{z}/{x}/{y}.png',{
  attribution:'&copy; OpenStreetMap &copy; CARTO',subdomains:'abcd',maxZoom:19
}).addTo(map);

function lerp3(t,stops){
  t=Math.max(0,Math.min(1,t));
  const n=stops.length-1,i=Math.min(Math.floor(t*n),n-1),f=t*n-i,a=stops[i],b=stops[i+1];
  return `rgb(${a[0]+(b[0]-a[0])*f|0},${a[1]+(b[1]-a[1])*f|0},${a[2]+(b[2]-a[2])*f|0})`;
}
function distColor(dk){
  const cfg=METRIC_CFG[curMetric];
  const vals=Object.values(AGG).map(d=>d[curMetric]||0);
  if(!vals.length) return 'rgba(71,197,255,0.15)';
  const v=(AGG[dk]||{})[curMetric]||0;
  const {mn,mx,edges}=dataEdges(curMetric);
  if(colorMode==='discrete'){
    const idx=bucketIndex(edges,v);
    if(activeFilterBuckets.size>0&&!activeFilterBuckets.has(idx)) return 'rgba(100,116,139,0.12)';
    return lerp3(idx/edges.length,cfg.stops);
  }
  return lerp3(mx===mn?0.5:(v-mn)/(mx-mn),cfg.stops);
}
function distStyle(feat){
  const dk=String(feat.properties[DIST_FIELD]);
  const sel=dk===String(selDist);
  const has=!!AGG[dk];
  return {
    color:sel?'#e8ff47':'rgba(232,255,71,0.3)',
    weight:sel?2.5:1,
    fillColor:has?distColor(dk):'rgba(20,25,35,0.9)',
    fillOpacity:has?(sel?0.72:0.52):0.0,
    stroke:has,
  };
}

function showPanel(dk,props){
  document.getElementById('dp-ph').style.display='none';
  const dd=document.getElementById('dp-detail');dd.style.display='block';
  document.getElementById('dp-num').textContent=LABEL+' '+props[DIST_FIELD];
  document.getElementById('dp-name').textContent=NAME_FIELD?(props[NAME_FIELD]||''):'';
  const party=PARTY_FIELD?(props[PARTY_FIELD]||''):'';
  const pe=document.getElementById('dp-party');pe.textContent=party;
  pe.className='dp-party '+(party.includes('Democrat')?'party-D':party.includes('Republican')?'party-R':'party-I');
  const grid=document.getElementById('dp-grid');grid.innerHTML='';
  const agg=AGG[dk]||{};
  [['count','Properties'],['exempt','Exempt Props'],...MKEYS.filter(k=>k!=='count').map(k=>[k,METRIC_CFG[k].label])].forEach(([k,lbl])=>{
    const v=agg[k];if(v===undefined||v===null)return;
    const fmt=METRIC_CFG[k]?METRIC_CFG[k].fmt:(x=>x.toLocaleString());
    grid.innerHTML+=`<div class="dp-cell"><div class="dp-k">${lbl}</div><div class="dp-v">${fmt(v)}</div></div>`;
  });
}

function popupHTML(dk,props){
  const agg=AGG[dk]||{};
  const name=NAME_FIELD?(props[NAME_FIELD]||''):'';
  const party=PARTY_FIELD?(props[PARTY_FIELD]||''):'';
  const pc=party.includes('Democrat')?'party-D':party.includes('Republican')?'party-R':'party-I';
  let rows='';
  [['count','Properties'],['exempt','Exempt'],...MKEYS.filter(k=>k!=='count').map(k=>[k,METRIC_CFG[k].label])].forEach(([k,lbl])=>{
    const v=agg[k];if(v===undefined||v===null)return;
    const fmt=METRIC_CFG[k]?METRIC_CFG[k].fmt:(x=>x.toLocaleString());
    rows+=`<div><div class="pu-k">${lbl}</div><div class="pu-v">${fmt(v)}</div></div>`;
  });
  return `<div class="pu-num">${LABEL} ${props[DIST_FIELD]}</div>
${name?`<div class="pu-name">${name}</div>`:''}
${party?`<div class="pu-party ${pc}">${party}</div>`:''}
<div class="pu-grid">${rows}</div>`;
}

function buildList(){
  const list=document.getElementById('dist-list');
  const hv=document.getElementById('dlh-val');if(hv)hv.textContent=METRIC_CFG[curMetric].label;
  const expanded=list.dataset.expanded==='1';
  let entries=Object.entries(AGG).sort((a,b)=>(b[1][curMetric]||0)-(a[1][curMetric]||0));

  if(colorMode==='discrete'&&activeFilterBuckets.size>0){
    const {edges}=dataEdges(curMetric);
    entries=entries.filter(([dk,d])=>activeFilterBuckets.has(bucketIndex(edges,d[curMetric]||0)));
  }

  const displayEntries=entries.map(([dk,d])=>[dk,d,d[curMetric]||0]);

  const cfg=METRIC_CFG[curMetric];
  const SHOW=5;
  const visible=expanded?displayEntries:displayEntries.slice(0,SHOW);

  list.innerHTML='';
  visible.forEach(([dk,d,v])=>{
    const feat=GJ.features.find(f=>String(f.properties[DIST_FIELD])===dk);
    const name=NAME_FIELD&&feat?(feat.properties[NAME_FIELD]||''):'';
    const item=document.createElement('div');
    item.className='dl-item'+(String(dk)===String(selDist)?' active':'');
    item.innerHTML=`<div class="dl-num">${dk}</div><div class="dl-name">${name}</div><div class="dl-val" style="color:${distColor(dk)}">${cfg.fmt(v)}</div>`;
    item.addEventListener('click',()=>{
      selDist=dk;
      const feat2=GJ.features.find(f=>String(f.properties[DIST_FIELD])===dk);
      if(feat2)showPanel(dk,feat2.properties);
      refreshLayer();buildList();
      const lyr=distLayer.getLayers().find(l=>String(l.feature.properties[DIST_FIELD])===dk);
      if(lyr)map.fitBounds(lyr.getBounds(),{padding:[40,40]});
    });
    list.appendChild(item);
  });

  // See More / See Less button
  if(displayEntries.length>SHOW){
    const btn=document.createElement('div');
    btn.style.cssText='padding:7px 14px;font-size:10px;color:var(--accent2);cursor:pointer;text-align:center;letter-spacing:.1em;text-transform:uppercase;border-top:1px solid var(--border)';
    btn.textContent=expanded?'See Less ▲':'See More ▼';
    btn.addEventListener('click',()=>{
      list.dataset.expanded=expanded?'0':'1';
      buildList();
    });
    list.appendChild(btn);
  }
}

function refreshLayer(){if(distLayer)distLayer.setStyle(f=>distStyle(f));}

function initLayer(){
  distLayer=L.geoJSON(GJ,{
    style:distStyle,
    onEachFeature:(feat,layer)=>{
      const dk=String(feat.properties[DIST_FIELD]);
      if(!AGG[dk])return;  // no properties — no interaction
      layer.bindPopup(()=>popupHTML(dk,feat.properties),{maxWidth:280});
      layer.on('mouseover',function(){
        if(dk!==String(selDist))this.setStyle({fillOpacity:0.72,weight:2,color:'rgba(232,255,71,0.7)'});
        showPanel(dk,feat.properties);
      });
      layer.on('mouseout',function(){
        distLayer.resetStyle(this);
        if(selDist){const f2=distLayer.getLayers().find(l=>String(l.feature.properties[DIST_FIELD])===String(selDist));if(f2)f2.setStyle(distStyle(f2.feature));}
      });
      layer.on('click',function(){
        selDist=dk;showPanel(dk,feat.properties);refreshLayer();buildList();
        map.fitBounds(layer.getBounds(),{padding:[40,40]});
      });
    }
  }).addTo(map);
}

document.querySelectorAll('.mbt').forEach(b=>b.addEventListener('click',()=>{
  curMetric=b.dataset.metric;
  activeFilterBuckets.clear();
  document.querySelectorAll('.mbt').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  document.getElementById('ltitle').textContent=METRIC_CFG[curMetric].label;
  document.getElementById('lbar').style.background=METRIC_CFG[curMetric].grad;
  if(colorMode==='discrete') renderDiscreteLegend();
  refreshLayer();buildList();
}));

window.addEventListener('load',async()=>{
  try{
    // Load pre-computed district aggregates (from Python spatial join)
    document.getElementById('load-status').textContent='Loading district data…';
    const [aggResp] = await Promise.all([fetch('district_data.json')]);
    if(!aggResp.ok) throw new Error('district_data.json not found — run the Python script first');
    AGG = await aggResp.json();
    console.log('Districts with data:',Object.keys(AGG).length);
    initLayer();buildList();
    document.getElementById('ltitle').textContent=METRIC_CFG[curMetric].label;
    document.getElementById('lbar').style.background=METRIC_CFG[curMetric].grad;
    const el=document.getElementById('loading');el.classList.add('out');setTimeout(()=>el.remove(),600);
  }catch(err){
    document.getElementById('load-status').textContent='Error: '+err.message;
    console.error(err);
  }
});
</script>
</body>
</html>
